<!doctype html>
<!-- Social-card generator (Yesternerd, rebuilt 4 Aug 2026 — the previous
     version of this file was the retired Dead Famous card). Open at exactly
     1200x630 and screenshot body (tools: playwright, see scratchpad
     socialshot.py pattern). Output lives at assets/brand/social-card.png and
     is referenced by og:image / twitter:image in index.html.
     The statue is the APPROVED square-glasses die-cut (concepts/…-v2). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face {font-family:'DF Mono';src:url('../assets/fonts/space-mono-bold.woff2') format('woff2');font-weight:700;}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  width:1200px;height:630px;overflow:hidden;position:relative;
  background:#0B0B0B;
}
.left{
  position:absolute;left:14px;top:14px;bottom:14px;width:618px;
  background:#F2EFE6;
  background-image:radial-gradient(rgba(11,11,11,.08) 2px,transparent 2.4px);
  background-size:30px 30px;
  padding:0 66px;display:flex;flex-direction:column;justify-content:center;gap:38px;
}
.wordmark{width:462px;display:block;}
.tag{
  font-family:'DF Mono',monospace;font-weight:700;font-size:27px;
  letter-spacing:.18em;text-transform:uppercase;color:#0B0B0B;white-space:nowrap;
}
.plate{
  align-self:flex-start;background:#0B0B0B;color:#F2EFE6;
  font-family:'DF Mono',monospace;font-weight:700;font-size:27px;letter-spacing:.04em;
  padding:12px 24px;box-shadow:8px 8px 0 #FF3DDB;
}
.right{
  position:absolute;right:14px;top:14px;bottom:14px;left:646px;
  background:rgb(247,188,2);overflow:hidden;
}
.right img{
  position:absolute;width:660px;left:-50px;top:22px;display:block;
}
</style>
</head>
<body>
  <div class="left">
    <img class="wordmark" src="../assets/brand/yesternerd-wordmark-primary-v2.png" alt="Yesternerd">
    <p class="tag">Four daily history games</p>
    <p class="plate">yesternerd.app</p>
  </div>
  <div class="right">
    <img src="../assets/brand/concepts/yesternerd-antinous-square-glasses-diecut-sticker-v2.png" alt="">
  </div>
</body>
</html>
