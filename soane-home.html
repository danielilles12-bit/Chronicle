<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chronicle — The Soane (home proof)</title>
<style>
  @font-face { font-family: 'Chronicle Display'; src: url('assets/fonts/ChronicleDisplay-Regular.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Chronicle Text'; src: url('assets/fonts/ChronicleText-Regular.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Chronicle Text'; src: url('assets/fonts/ChronicleText-Italic.woff2') format('woff2'); font-weight: 400; font-style: italic; }

  :root {
    --wall: #413a2f;
    --wall-dark: #2b251d;
    --bone: #e6dcc9;
    --bone-dim: #b3a88f;
    --gilt: #b18d43;
    --gilt-bright: #d3af62;
    --gilt-shadow: #6b5426;
    --mahogany: #35241732;
    --oxblood: #6e1423;
    --plaque-ink: #2b2115;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Chronicle Text', Georgia, serif;
    color: var(--bone);
    background: #1c1812;
    display: flex; justify-content: center;
  }
  .phone {
    width: 100%; max-width: 420px; min-height: 100vh;
    position: relative; overflow: hidden;
    background:
      radial-gradient(140% 90% at 50% 0%, rgba(230, 214, 176, 0.10) 0%, rgba(230,214,176,0.03) 38%, rgba(0,0,0,0.42) 100%),
      repeating-linear-gradient(90deg, transparent 0px, transparent 136px, rgba(0,0,0,0.14) 136px, rgba(0,0,0,0.14) 138px, rgba(255,255,255,0.02) 138px, rgba(255,255,255,0.02) 139px, transparent 139px, transparent 140px),
      linear-gradient(180deg, #4b4534 0%, #454033 40%, #3a352b 100%);
    padding: 0 18px 34px;
  }

  /* ——— masthead ——— */
  .masthead { text-align: center; padding: 44px 0 24px; }
  .masthead .rule {
    height: 1px; background: linear-gradient(90deg, transparent, rgba(177,141,67,0.75), transparent);
    margin: 0 26px;
  }
  .masthead h1 {
    font-family: 'Chronicle Display', Georgia, serif; font-weight: 400;
    font-size: 30px; letter-spacing: 0.34em; text-indent: 0.34em;
    color: var(--bone); margin: 14px 0 6px;
    text-shadow: 0 1px 0 rgba(0,0,0,0.4);
  }
  .masthead .dateline {
    font-style: italic; font-size: 14px; color: var(--bone-dim); margin-bottom: 14px;
  }

  /* ——— frames ——— */
  .wall { display: flex; flex-direction: column; gap: 30px; padding-top: 12px; }

  .frame {
    display: block; text-decoration: none; color: inherit;
    background: #241d15;
    border: 1px solid var(--gilt);
    outline: 1px solid rgba(0,0,0,0.55);
    box-shadow:
      inset 0 0 0 2px #191410,
      inset 0 0 0 3px var(--gilt-shadow),
      0 2px 3px rgba(0,0,0,0.45),
      0 14px 28px rgba(0,0,0,0.45);
    padding: 9px;
    position: relative;
  }
  .frame .art { display: block; width: 100%; object-fit: cover; filter: saturate(0.92) contrast(1.02); }
  .frame .glass {
    position: absolute; inset: 9px; pointer-events: none;
    background: linear-gradient(118deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.0) 26%);
  }

  .plaque {
    margin: 9px -1px -1px; padding: 7px 10px 6px;
    background: linear-gradient(180deg, #9d7f42 0%, #8c6f36 60%, #7d6230 100%);
    border-top: 1px solid rgba(255,255,255,0.22);
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    position: relative;
  }
  .plaque .lot {
    font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--plaque-ink); opacity: 0.82;
  }
  .plaque .title {
    font-family: 'Chronicle Display', Georgia, serif;
    font-size: 15px; color: var(--plaque-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .plaque .state { font-style: italic; font-size: 12px; color: rgba(43,33,21,0.75); white-space: nowrap; }

  .hero .art { aspect-ratio: 5 / 4; }
  .hero .plaque { display: block; text-align: left; padding: 8px 64px 8px 12px; }
  .hero .plaque .lotline { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
  .hero .plaque .title { display: block; font-size: 17px; }

  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; align-items: start; }
  .row .frame { padding: 6px; }
  .row .frame:nth-child(2) { margin-top: 10px; }
  .row .frame:nth-child(3) { margin-top: 4px; }
  .row .art { aspect-ratio: 3 / 4; }
  .row .plaque { margin: 6px -1px -1px; padding: 6px 4px 5px; display: block; text-align: center; }
  .row .plaque .lot { font-size: 9px; letter-spacing: 0.14em; display: block; white-space: nowrap; overflow: hidden; }

  /* sliver state — unplayed Face Value shows one deliberate slice of the face */
  .sliver-wrap { position: relative; aspect-ratio: 3 / 4; background: #241d15; }
  .sliver-wrap .slit {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 38%;
    transform: translateX(-50%); overflow: hidden;
    border-left: 1px solid rgba(211,175,98,0.35); border-right: 1px solid rgba(211,175,98,0.35);
  }
  .sliver-wrap .slit img {
    width: 430%; height: 100%; object-fit: cover; object-position: 50% 5%;
    margin-left: -165%; filter: saturate(0.85);
  }

  /* empty state — Thread unplayed is a bare 16-tile grid */
  .grid16 {
    aspect-ratio: 3 / 4; display: grid;
    grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 2px;
    background: #221c14; padding: 4px;
  }
  .grid16 span { background: rgba(230,214,176,0.07); border: 1px solid rgba(230,214,176,0.05); }
  .grid16 span:nth-child(6), .grid16 span:nth-child(11) { background: rgba(211,175,98,0.13); }
  .grid16 span:nth-child(16) { background: rgba(211,175,98,0.09); }

  /* wax seal on the solved hero plaque — the seal stamps the label, never the art */
  .seal {
    position: absolute; right: 12px; top: -17px;
    width: 40px; height: 40px; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #8d2434 0%, #6e1423 48%, #4e0d19 100%);
    box-shadow: 0 2px 5px rgba(0,0,0,0.5), inset 0 0 0 3px rgba(255,255,255,0.07), inset 0 0 9px rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Chronicle Display', Georgia, serif; font-size: 17px; color: #e9cfc4;
    transform: rotate(-8deg);
  }

  /* ——— footer ——— */
  .foot { text-align: center; margin-top: 44px; }
  .foot .rule { height: 1px; background: linear-gradient(90deg, transparent, rgba(177,141,67,0.55), transparent); margin: 0 46px 12px; }
  .foot p { font-style: italic; font-size: 13.5px; color: var(--bone-dim); }
</style>
</head>
<body>
<div class="phone">

  <header class="masthead">
    <div class="rule"></div>
    <h1>CHRONICLE</h1>
    <p class="dateline">Monday 6 July 2026 · Gallery №142</p>
    <div class="rule"></div>
  </header>

  <main class="wall">

    <!-- HERO — yesterday's Relic, solved & sealed, holds the wall -->
    <a class="frame hero" href="#">
      <img class="art" src="assets/img/alfred-jewel.jpg" alt="">
      <span class="glass"></span>
      <div class="plaque">
        <div class="lotline">
          <span class="lot">Lot №4 · Relic</span>
          <span class="state">solved in 3</span>
        </div>
        <span class="title">The Alfred Jewel</span>
        <span class="seal">D</span>
      </div>
      <!-- seal sits over the plaque's right end, clear of the text -->
      <style>.hero .seal { right: 14px; top: auto; bottom: 6px; }</style>
    </a>

    <!-- THE WHISPERS — today's three, in their unplayed states -->
    <div class="row">

      <a class="frame" href="#">
        <div class="grid16">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="plaque"><span class="lot">Thread</span></div>
      </a>

      <a class="frame" href="#">
        <div class="sliver-wrap">
          <div class="slit"><img src="assets/img/augustus-caesar.jpg" alt=""></div>
        </div>
        <div class="plaque"><span class="lot">Face Value</span></div>
      </a>

      <a class="frame" href="#">
        <img class="art" src="assets/img/artemisia-gentileschi.jpg" alt="" style="filter: saturate(0.85) brightness(0.96) contrast(1.02);">
        <span class="glass"></span>
        <div class="plaque"><span class="lot">Lifeline</span></div>
      </a>

    </div>
  </main>

  <footer class="foot">
    <div class="rule"></div>
    <p>Viewing closes at midnight.</p>
  </footer>

</div>
</body>
</html>
