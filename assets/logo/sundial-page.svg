        fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M52 12 V32 H72 Z" fill="currentColor"/>
  <path d="M52 32 L37.4 53.05 L41.1 55.15 Z" fill="currentColor"/>
  <g stroke="currentColor" stroke-width="3" stroke-linecap="round">
    <path d="M59.25 59.05 L60.4 63.4"/>
    <path d="M27.3 45.1 L23.3 47.2"/>
  </g>
  <path d="M37 58 L34.5 62.3" stroke="#9a7b2d" stroke-width="3.4" stroke-linecap="round"/>
</svg>
