<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" style="color:#121212">
  <!-- Chronicle · alternate mark. A dog-eared page whose folded corner casts a
       sundial's shadow — paper that tells time. The gold tick is "now".
       Ink = currentColor; gold garnish. -->
