<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" style="color:#121212">
  <!-- Chronicle · primary mark (round-three winner). A question mark cut like
       a key: the hook is the bow, the stem is the blade, the teeth do the
       unlocking, and the gold dot is the point you play for.
       Ink = currentColor; gold is garnish (swap to currentColor for one-colour). -->
  <g transform="rotate(-6 48 45)">
    <path d="M32.55 25.86 A16 16 0 1 1 48 46 L48 60" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
    <path d="M50.5 51 H59 M50.5 58 H56.5" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="48" cy="73" r="4.8" fill="#9a7b2d"/>
  </g>
</svg>
